plugins { id 'com.android.application' }
android {
    namespace 'vn.chatheotracker'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.chatheotracker'
        minSdk 29
        targetSdk 35
        versionCode 25
        versionName '2.5-threat-evidence-preview' 
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
