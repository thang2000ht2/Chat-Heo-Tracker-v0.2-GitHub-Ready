plugins { id 'com.android.application' }
android {
    namespace 'vn.chatheotracker'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.chatheotracker'
        minSdk 29
        targetSdk 35
        versionCode 29
        versionName '2.9-hand-sync-atomic-moves-logs' 
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
