plugins { id 'com.android.application' }
android {
    namespace 'vn.chatheotracker'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.chatheotracker'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '0.7-auto-reset-responsive-hud'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
